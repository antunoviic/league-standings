<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}League Standings{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topbar">
        <div class="container topbar-inner">
            <a class="brand" href="{{ url_for('main.index') }}">League Standings</a>
            <nav>
                <a href="{{ url_for('complete_match.complete_match_page') }}">Complete Match <span class="db-badge sql">SQL</span></a>
                <a href="{{ url_for('complete_match_mongo.complete_match_mongo_page') }}">Complete Match <span class="db-badge mongo">MongoDB</span></a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
